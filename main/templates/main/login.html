{% extends "main/base.html" %}

{% block title %}Вход{% endblock title %}

{% block content %}
    <h1>Вход</h1>

    <form method="post">
        {% csrf_token %}
        {{ form }}

        {% if next %}
            <input type="hidden" name="next" value="{{ next }}">
        {% endif %}
        <button type="submit">Войти</button>
    </form>
    <p>Еще нет аккаунта? <a href="{% url 'register' %}">Зарегистрироваться</a></p>
{% endblock content %}
